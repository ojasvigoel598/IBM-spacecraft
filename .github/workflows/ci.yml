name: CI

# Enforces the repo's sync contract on every push to main and on PRs:
#   1. environment gate + full test suite must pass
#   2. running the tests must not dirty the tree (phantom-diff guard)
#   3. no secrets may be committed
#   4. pushed commits must be authored by the pinned personal identity
#
# The test job mirrors the documented local setup (see README quickstart):
# it creates a virtualenv, installs requirements.txt into it, and registers
# a notebook kernel, because missionmind/check_environment.py verifies that
# a venv and Jupyter kernel specs exist before it passes.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests + clean-tree guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Create virtualenv (mirror local setup)
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: .venv/bin/python -m pip install --upgrade pip && .venv/bin/python -m pip install -r requirements.txt
      - name: Cache NASA battery data (real B0005/6/7/B0018 .mat files)
        id: nasa-cache
        uses: actions/cache@v4
        with:
          path: missionmind/data/real_nasa/*.mat
          key: nasa-battery-${{ hashFiles('missionmind/ml/download_nasa_data.py') }}
          restore-keys: |
            nasa-battery-
      - name: Download NASA battery data (only on cache miss)
        if: steps.nasa-cache.outputs.cache-hit != 'true'
        run: .venv/bin/python -m missionmind.ml.download_nasa_data
      - name: Register notebook kernel (environment gate checks kernel specs)
        run: .venv/bin/python -m ipykernel install --user --name missionmind-ci
      - name: Environment gate
        run: .venv/bin/python -m missionmind.check_environment
      - name: Run test suite
        run: .venv/bin/python -m pytest missionmind/tests/ -q
      - name: Dataset-change check (physics must not silently alter the training set)
        run: |
          # The dataset_id is the invariant: a hash (rounded to 6 decimals, to
          # absorb last-ULP cross-platform float differences) of the actual
          # fitted feature matrices, produced by IEEE-deterministic arithmetic
          # + a frozen PCG64 RNG, so it reproduces across platforms and
          # Python/sklearn versions. The physics deliberately avoids platform
          # pow() (numpy `x ** 4` differs across libms; the thermal ODE uses
          # explicit multiplication instead). Fitted model BYTES are
          # version-dependent (sklearn internals), so only the id is compared;
          # model behaviour is guarded by the detect gates and the test suite
          # in this same job.
          OLD_ID=$(python -c "import json;print(json.load(open('missionmind/models/dataset.json'))['dataset_id'])")
          .venv/bin/python -m missionmind.ml.train --retrain
          NEW_ID=$(python -c "import json;print(json.load(open('missionmind/models/dataset.json'))['dataset_id'])")
          if [ "$OLD_ID" != "$NEW_ID" ]; then
            echo "::error::dataset_id changed ($OLD_ID -> $NEW_ID): a physics/code change altered the training data. Commit the new models + dataset.json deliberately (models/dataset.json records the dataset_id)."
            exit 1
          fi
          echo "dataset check: committed training set reproduces (dataset_id $NEW_ID)"
          # restore environment-dependent model bytes so the phantom-diff guard
          # below sees the committed tree
          git checkout -- missionmind/models
      - name: Phantom-diff guard (testing must not modify the tree)
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::tests modified tracked or untracked files - the tree must stay clean after a run"
            exit 1
          fi
          echo "phantom-diff guard: tree clean"
      - name: Secret scan (tracked files)
        run: |
          if grep -rInE 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            --include='*.py' --include='*.json' --include='*.md' \
            --include='*.yml' --include='*.yaml' --include='*.toml' \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules \
            --exclude='package-lock.json' .; then
            echo "::error::possible secret committed to the repository"
            exit 1
          fi
          echo "secret scan: clean"

  frontend:
    name: Frontend build + demo assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build the console (tsc + vite)
        working-directory: web
        run: npm run build
      - name: Validate demo assets (video + captions)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check imageio-ffmpeg
          python3 - <<'EOF'
          import subprocess
          from pathlib import Path

          srt = Path("demo/captions.srt")
          assert srt.exists(), "demo/captions.srt missing"
          cues = [b for b in srt.read_text(encoding="utf-8").split("\n\n") if b.strip()]
          assert len(cues) >= 10, f"expected >=10 SRT cues, got {len(cues)}"

          mp4 = Path("demo/missionmind_demo.mp4")
          assert mp4.exists(), "demo/missionmind_demo.mp4 missing"
          assert mp4.stat().st_size > 1_000_000, "demo video suspiciously small"

          import imageio_ffmpeg
          ff = imageio_ffmpeg.get_ffmpeg_exe()
          r = subprocess.run([ff, "-i", str(mp4)], capture_output=True, text=True)
          probe = r.stderr
          assert "Duration" in probe and "Audio:" in probe, "demo video invalid or missing audio"
          print(f"demo assets OK: {len(cues)} cues, {mp4.stat().st_size/1e6:.1f} MB video")
          EOF

  sync:
    name: Sync rule (author identity)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Verify pushed HEAD is authored by ojasvigoel598
        run: |
          AUTHOR_NAME=$(git log -1 --format='%an')
          AUTHOR_EMAIL=$(git log -1 --format='%ae')
          echo "HEAD authored by: $AUTHOR_NAME <$AUTHOR_EMAIL>"
          if ! echo "$AUTHOR_NAME" | grep -q 'ojasvigoel598' && ! echo "$AUTHOR_EMAIL" | grep -q 'ojasvigoel598'; then
            echo "::error::pushed commit is not authored by ojasvigoel598"
            exit 1
          fi
          echo "identity check: PASS"
